<!DOCTYPE html>
<html lang="es-ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compra productos de tecnología en Star Wars - Fan Page">
    <title>Comprar - Star Wars - Fan Page</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar" role="navigation" aria-label="Navegación principal">
            <!-- Nombre del sitio - lado izquierdo -->
            <div class="site-name">
                <h1 class="site-title">Star Wars - Fan Page</h1>
            </div>

            <!-- Logo - centro -->
            <div class="logo">
                <a href="../index.html" class="logo-link">
                    <img src="../img/logo-sw-fp.png" alt="Star Wars - Fan Page Logo" class="logo-image">
                </a>
            </div>

            <!-- Menú de navegación y usuario - lado derecho -->
            <div class="nav-right">
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Inicio</a></li>
                    <li><a href="./compras.html" class="nav-link active">Comprar</a></li>
                    <li><a href="./ventas.html" class="nav-link">Vender</a></li>
                    <li><a href="./peliculas.html" class="nav-link">Peliculas</a></li>
                </ul>

            </div>
        </nav>
    </header>

    <section class="page-header" role="region" aria-label="Encabezado de página">
        <div class="page-header-content">
            <h1 class="page-title">Catálogo de Merch</h1>
            <p class="page-description">Revisa nuestro catalogo de merchandising</p>
        </div>
    </section>

    <main class="main-content">
        <!-- Barra de búsqueda y filtros -->
        <section class="search-filters" role="region" aria-label="Búsqueda y filtros">
            <div class="search-bar">
                <input type="search" id="search-input" class="search-input" placeholder="Buscar productos..." aria-label="Buscar productos">
                <button type="button" class="btn-search" id="search-btn">Buscar</button>
            </div>
            <div class="filters">
                <select id="category-filter" class="filter-select" aria-label="Filtrar por categoría">
                    <option value="">Todas las categorías</option>
                    <option value="laptops">Laptops</option>
                    <option value="smartphones">Smartphones</option>
                    <option value="tablets">Tablets</option>
                    <option value="accesorios">Accesorios</option>
                </select>
                <select id="price-filter" class="filter-select" aria-label="Filtrar por precio">
                    <option value="">Todos los precios</option>
                    <option value="0-500">$0 - $500</option>
                    <option value="500-1000">$500 - $1000</option>
                    <option value="1000-5000">$1000+</option>
                </select>
            </div>
        </section>

        <!-- Grid de productos -->
        <section class="productos-section" role="region" aria-label="Productos disponibles">
            <div id="productos-grid" class="productos-grid">
                <!-- Los productos se cargarán aquí con JavaScript -->
                <div class="loading-message">Cargando productos...</div>
            </div>
        </section>

        <!-- Paginación -->
        <section class="pagination-section" role="region" aria-label="Paginación">
            <div id="pagination" class="pagination">
                <!-- Los botones de paginación se cargarán aquí con JavaScript -->
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="footer-content">
            <p class="footer-text">&copy; 2026 Star Wars - Fan Page. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/pages/compras.js"></script>
</body>

</html>
