<!DOCTYPE html>
<html lang="es-ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Star Wars - Fan Page">
    <title>Star Wars - Fan Page</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="site-name">
                <h1 class="site-title">Star Wars - Fan Page</h1>
            </div>

            <!-- Logo - centro -->
            <div class="logo">
                <a href="#" class="logo-link">
                    <img src="./img/logo-sw-fp.png" alt="Star Wars Fan Page Logo" class="logo-image">
                </a>
            </div>

            <div class="nav-right">
                <ul class="nav-menu">
                    <li><a href="./index.html" class="nav-link">Inicio</a></li>
                    <li><a href="./pages/compras.html" class="nav-link">Comprar</a></li>
                    <li><a href="./pages/peliculas.html" class="nav-link">Peliculas</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="main-content">
        <section class="opciones-principales" role="region" aria-label="Opciones principales">
            <div class="section-header">
                <h2 class="section-title">¿Qué deseas hacer?</h2>
            </div>

            <div class="opciones-grid">
                <article class="opcion-card" data-option="compras">
                    <h3 class="card-title">Comprar</h3>
                    <p class="card-description">Pasate y revisa nuestro catalogo de merchandising</p>
                    <a href="./pages/compras.html" class="btn-secondary" role="button">Ver Productos</a>
                </article>

                <article class="opcion-card" data-option="peliculas">
                    <h3 class="card-title">Peliculas</h3>
                    <p class="card-description">Descubre nuestras películas favoritas</p>
                    <a href="./pages/peliculas.html" class="btn-secondary" role="button">Ver Películas</a>
                </article>
            </div>
        </section>
    </main>
    <footer class="site-footer" role="contentinfo">
        <div class="footer-content">
            <p class="footer-text">&copy; 2026 Star Wars - Fan Page. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="./js/main.js"></script>
